name: Android CI — Ultimate Gamepad (sin PC)

# Compila desde GitHub Actions. El usuario solo hace push desde el
# teléfono (app de GitHub) y descarga los APKs de la pestaña Actions.
# No requiere PC, ni servicios de pago, ni secretos para el APK debug.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # H-09: un Gradle colgado no debe consumir el límite por defecto
    # (6 h); y con los pushes de un commit por archivo solo importa
    # el HEAD: un run nuevo cancela el anterior en cola o en curso.
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        # H-09: acciones pineadas a SHA (tags mutables): SHAs
        # verificados con git ls-remote en el repo oficial de cada
        # acción (checkout v4, setup-java v4, setup-gradle v3,
        # upload-artifact v4).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Run core unit tests
        run: gradle :core:testDebugUnitTest --stacktrace

      - name: Build phone debug APK
        run: gradle :app-phone:assembleDebug --stacktrace

      - name: Build TV debug APK
        run: gradle :app-tv:assembleDebug --stacktrace

      - name: Build release APKs (sin firmar en Etapa 1)
        run: gradle :app-phone:assembleRelease :app-tv:assembleRelease --stacktrace

      - name: Upload phone APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-phone-apks
          path: |
            app-phone/build/outputs/apk/debug/app-phone-debug.apk
            app-phone/build/outputs/apk/release/app-phone-release-unsigned.apk
          if-no-files-found: error

      - name: Upload TV APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-tv-apks
          path: |
            app-tv/build/outputs/apk/debug/app-tv-debug.apk
            app-tv/build/outputs/apk/release/app-tv-release-unsigned.apk
          if-no-files-found: error
